name: Tests

# Runs the regression tests on every push to main and before every release.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1
        run: pip install lupa

      - name: Check syntax and run regression tests
        run: python tests/run.py
