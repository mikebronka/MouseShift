name: Draft release

# Keeps a draft GitHub release in sync with the newest version in
# CHANGELOG.md. The newest version is the first "## x.y.z" heading.
# Publishing the draft creates the tag, which starts the Release workflow.

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - .github/workflows/draft-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-)
          if [ -z "$version" ]; then
            echo "No version heading found in CHANGELOG.md."
            exit 0
          fi
          tag="v$version"
          title="$tag"

          # Release notes: everything under the version heading, up to the next one.
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md

          # Drafts are not returned by the release-by-tag endpoint, so search the
          # list. GitHub can replace a draft's tag with "untagged-...", so a
          # draft is also matched by its title.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\" or (.draft and .name == \"$title\")) | \"\(.id) \(.draft)\"" | head -n 1)

          if [ -z "$release" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$title" \
              -F body=@notes.md -F draft=true > /dev/null
            echo "Created draft release $tag."
          else
            id=${release%% *}
            draft=${release##* }
            if [ "$draft" = "true" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$title" -F body=@notes.md > /dev/null
              echo "Updated draft release $tag."
            else
              echo "$tag is already published. Add a new version to CHANGELOG.md for the next release."
            fi
          fi
